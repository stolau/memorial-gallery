{% extends "base.html" %}
{% block title %}{{ _('Upload photos: %(name)s', name=event.name) }} — Kaijankoski{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <h1 class="h3 mb-3">{{ _('Upload photos: %(name)s', name=event.name) }}</h1>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">{{ _('Photos') }}</label>
      <input type="file" name="photos" multiple class="form-control" required>
      <div class="form-text">{{ _('Supported formats: JPG, PNG, GIF, WEBP.') }}</div>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Caption (optional, applied to all)') }}</label>
      <input type="text" name="caption" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">{{ _('Upload') }}</button>
      <a class="btn btn-outline-secondary" href="/events/{{ event.slug }}">{{ _('Back to gallery') }}</a>
    </div>
  </form>
</div>
{% endblock %}
