{% extends "base.html" %}
{% block title %}Muokkaa — {{ person.display_name }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <h1 class="h3 mb-3">Muokkaa: {{ person.display_name }}</h1>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Nimi</label>
      <input type="text" name="display_name" class="form-control" value="{{ person.display_name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Elämäkerta</label>
      <textarea name="bio" class="form-control" rows="3">{{ person.bio or '' }}</textarea>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label">Syntymävuosi</label>
        <input type="number" name="birth_year" class="form-control" value="{{ person.birth_year or '' }}">
      </div>
      <div class="col-sm-6">
        <label class="form-label">Kuolinvuosi</label>
        <input type="number" name="death_year" class="form-control" value="{{ person.death_year or '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Syntymäpaikka</label>
      <input type="text" name="birthplace" class="form-control" value="{{ person.birthplace or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Ammatti</label>
      <input type="text" name="profession" class="form-control" value="{{ person.profession or '' }}">
    </div>

    <fieldset class="mb-3">
      <legend class="form-label fs-6 mb-2">Profiilikuva</legend>
      {% if person.profile_image %}
        <div class="d-flex align-items-start gap-3 mb-2">
          <img src="{{ url_for('views.media', slug=person.slug, filename=person.profile_image) }}"
               alt="" class="profile-img profile-img--preview rounded">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remove_profile_image" name="remove_profile_image">
            <label class="form-check-label" for="remove_profile_image">Poista nykyinen kuva</label>
          </div>
        </div>
      {% endif %}
      <input type="file" name="profile_image" accept="image/*" class="form-control">
      <div class="form-text">Valitse uusi kuva korvataksesi nykyisen.</div>
    </fieldset>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Tallenna</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('views.person', slug=person.slug) }}">Peruuta</a>
    </div>
  </form>
</div>
{% endblock %}
