{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <section class="text-center mb-5">
    <h1 class="display-4">Muistoksi</h1>
    <p class="lead text-muted">Sukumme muistosivusto.</p>
  </section>

  <section>
    <h2 class="h4 mb-3">Henkilöt</h2>
    {% if people %}
      <div class="row g-3">
        {% for p in people %}
          <div class="col-sm-6 col-md-4">
            <a href="{{ url_for('views.person', slug=p.slug) }}" class="card text-decoration-none text-reset h-100">
              <div class="card-body">
                <h3 class="h5 mb-1">{{ p.display_name }}</h3>
                {% if p.bio %}<p class="text-muted small mb-0">{{ p.bio }}</p>{% endif %}
              </div>
            </a>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-muted">Ei vielä henkilöitä.</p>
    {% endif %}
  </section>
</div>
{% endblock %}
