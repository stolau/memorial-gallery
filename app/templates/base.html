<!doctype html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kaijankoski{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-body">
  <nav class="navbar navbar-light bg-light border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="/">Kaijankoski</a>
      <div class="d-flex gap-2 align-items-center">
        <div class="btn-group btn-group-sm" role="group" aria-label="{{ _('Language') }}">
          {% for code in languages %}
            <a class="btn btn-outline-secondary {{ 'active' if code == current_lang }}"
               href="{{ url_for('views.set_language', code=code) }}">{{ code|upper }}</a>
          {% endfor %}
        </div>
        {% if session.authed %}
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin.index') }}">{{ _('Admin') }}</a>
          <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary">{{ _('Log out') }}</button>
          </form>
        {% endif %}
      </div>
    </div>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="container mt-3">
        {% for m in messages %}
          <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{{ _('Close') }}"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
