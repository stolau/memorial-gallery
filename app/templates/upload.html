{% extends "base.html" %}
{% block title %}Lataa kuvia — {{ person.display_name }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <h1 class="h3 mb-3">Lataa kuvia: {{ person.display_name }}</h1>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Kuvat</label>
      <input type="file" name="photos" multiple class="form-control" required>
      <div class="form-text">Tuetut muodot: JPG, PNG, GIF, WEBP.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Kuvateksti (vapaaehtoinen, sama kaikille)</label>
      <input type="text" name="caption" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Lataa</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('views.person', slug=person.slug) }}">Takaisin galleriaan</a>
    </div>
  </form>
</div>
{% endblock %}
