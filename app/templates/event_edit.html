{% extends "base.html" %}
{% block title %}{{ _('Edit: %(name)s', name=event.name) }} — Kaijankoski{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <h1 class="h3 mb-3">{{ _('Edit: %(name)s', name=event.name) }}</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">{{ _('Name') }}</label>
      <input type="text" name="name" class="form-control" value="{{ event.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Description') }}</label>
      <textarea name="description" class="form-control" rows="3">{{ event.description or '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Time') }}</label>
      <input type="text" name="event_time" class="form-control" value="{{ event.event_time or '' }}"
             placeholder="{{ _('e.g. Summer 1975') }}">
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Place') }}</label>
      <input type="text" name="place" class="form-control" value="{{ event.place or '' }}">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
      <a class="btn btn-outline-secondary" href="/events/{{ event.slug }}">{{ _('Cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
