{% extends "base.html" %}
{% block title %}Kirjaudu sisään — Kaijankoski{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
  <h1 class="h3 mb-3">Kirjaudu sisään</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Salasana</label>
      <input type="password" name="password" class="form-control" autofocus required>
    </div>
    <button type="submit" class="btn btn-primary">Kirjaudu</button>
  </form>
</div>
{% endblock %}
